<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imprimir Etiquetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #e4e6ebff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .label-container {
            width: 380px;
            height: 220px; /* Altura fixa para consistência */
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .label-body {
            display: flex;
            gap: 15px;
            flex-grow: 1;
        }

        .label-info {
            flex-grow: 1;
            text-align: left;
        }

        .label-info h1 {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            word-wrap: break-word;
        }

        .label-info p {
            font-size: 0.8rem;
            color: #6c757d;
            margin: 0;
        }

        .qr-code-container {
            flex-shrink: 0;
            text-align: center;
        }

        .qr-code-container img {
            width: 120px;
            height: 120px;
            border: 2px solid #333;
        }

        .label-footer {
            font-size: 0.75rem;
            color: #333;
            text-align: left;
            border-top: 1px dashed #ccc;
            padding-top: 8px;
            margin-top: auto;
        }

        /* Estilos para Impressão */
        @media print {
            body { background-color: #fff; }
            .print-button-container { display: none; }
            .page-container { padding: 0; gap: 0; }
            .label-container {
                box-shadow: none;
                border: 1px dashed #000;
                page-break-inside: avoid; /* Tenta não quebrar uma etiqueta no meio da página */
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        {% for item in items %}
        <div class="label-container">
            <div class="label-body">
                <div class="label-info">
                    <h1>{{ item.name }}</h1>
                    <p>{{ item.category }}</p>
                    <p class="mt-2"><strong>S/N:</strong> {{ item.serial_number or 'N/A' }}</p>
                    <p><strong>Local:</strong> {{ item.location or 'N/A' }}</p>
                </div>
                {% if item.item_uuid %}
                <div class="qr-code-container">
                    <img src="{{ url_for('generate_qrcode', item_uuid=item.item_uuid) }}" alt="QR Code">
                </div>
                {% endif %}
            </div>
            <div class="label-footer">
                <strong>ID:</strong> {{ item.item_uuid }}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="print-button-container position-fixed bottom-0 end-0 p-3">
        <button class="btn btn-primary btn-lg" onclick="window.print();"><i class="bi bi-printer-fill"></i> Imprimir Todas</button>
    </div>

</body>
</html>
