<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etiqueta - {{ item.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .label-container {
            width: 400px;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .label-header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            word-wrap: break-word;
        }

        .label-header p {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }

        .qr-code {
            margin: 1rem auto;
            border: 4px solid #333;
            padding: 5px;
            display: inline-block;
        }

        .qr-code img {
            display: block;
            width: 180px;
            height: 180px;
        }

        .item-details {
            text-align: left;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .item-details strong {
            display: inline-block;
            width: 120px;
        }

        .print-button-container {
            margin-top: 2rem;
            text-align: center;
        }

        /* Estilos para Impressão */
        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .print-button-container {
                display: none;
            }
            .label-container {
                box-shadow: none;
                border: 1px dashed #000;
                margin: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="label-container">
        <div class="label-header">
            <h1>{{ item.name }}</h1>
            <p>{{ item.category }}</p>
        </div>

        {% if item.item_uuid %}
        <div class="qr-code">
            <img src="{{ url_for('generate_qrcode', item_uuid=item.item_uuid) }}" alt="QR Code do Item">
        </div>
        {% endif %}

        <div class="item-details">
            <p><strong>Nº de Série:</strong> {{ item.serial_number or 'N/A' }}</p>
            <p><strong>Localização:</strong> {{ item.location or 'N/A' }}</p>
            <p><strong>ID Único:</strong> {{ item.item_uuid }}</p>
        </div>
    </div>

    <div class="print-button-container position-fixed bottom-0 end-0 p-3">
        <button class="btn btn-primary btn-lg" onclick="window.print();"><i class="bi bi-printer-fill"></i> Imprimir</button>
    </div>

</body>
</html>
