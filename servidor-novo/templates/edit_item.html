{% extends 'base.html' %}

{% block title %}Editar Item{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Editar Item: {{ item.name }}</h1>
        {% if item.item_uuid %}
        <div class="text-center">
            <img src="{{ url_for('generate_qrcode', item_uuid=item.item_uuid) }}" alt="QR Code" style="width: 100px; height: 100px; border: 2px solid #fff; border-radius: 5px;">
            <p class="small text-muted mb-0 mt-1">ID: {{ item.item_uuid[:8] }}...</p>
        </div>
        {% endif %}
    </div>

    <form method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Nome do Item</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
            </div>
            <div class="col-md-6">
                <label for="model" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="model" name="model" value="{{ item.model or '' }}">
            </div>
            <div class="col-md-6">
                <label for="category" class="form-label">Categoria</label>
                <input type="text" class="form-control" id="category" name="category" value="{{ item.category }}" required>
            </div>
            <div class="col-md-6">
                <label for="location" class="form-label">Localização</label>
                <input type="text" class="form-control" id="location" name="location" value="{{ item.location }}" required>
            </div>
            <div class="col-md-6">
                <label for="purchase_date" class="form-label">Data de Aquisição</label>
                <input type="date" class="form-control" id="purchase_date" name="purchase_date" value="{{ item.purchase_date }}" required>
            </div>
            <div class="col-md-6">
                <label for="serial_number" class="form-label">Número de Série</label>
                <input type="text" class="form-control" id="serial_number" name="serial_number" value="{{ item.serial_number or '' }}">
            </div>
            <div class="col-md-6">
                <label for="status" class="form-label">Condição</label>
                <select class="form-select" id="status" name="status" required>
                    {% set statuses = ['Muito Bom', 'Bom', 'Aceitável', 'Ruim', 'Quebrado'] %}
                    {% for s in statuses %}
                        <option value="{{ s }}" {% if item.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="availability_status" class="form-label">Disponibilidade</label>
                <select class="form-select" id="availability_status" name="availability_status" required>
                    {% set avail_statuses = ['Livre', 'Em uso', 'Em manutenção', 'Devolvido'] %}
                    {% for s in avail_statuses %}
                        <option value="{{ s }}" {% if item.availability_status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="assigned_to" class="form-label">Atribuído a</label>
                <select class="form-select" id="assigned_to" name="assigned_to">
                    <option value="">Ninguém</option>
                    {% for user in all_users %}
                        <option value="{{ user.username }}" {% if item.assigned_to == user.username %}selected{% endif %}>{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="authorized_by" class="form-label">Autorizado por</label>
                <select class="form-select" id="authorized_by" name="authorized_by">
                    <option value="">N/A</option>
                    {% for admin in all_admins %}
                        <option value="{{ admin.username }}" {% if item.authorized_by == admin.username %}selected{% endif %}>{{ admin.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label for="status_notes" class="form-label">Observações da Alteração</label>
                <textarea class="form-control" id="status_notes" name="status_notes" rows="3" placeholder="Se a condição do item foi alterada, adicione uma justificativa aqui."></textarea>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{{ url_for('generate_label', id=item.id) }}" class="btn btn-info" target="_blank">
                <i class="bi bi-printer"></i> Imprimir Etiqueta
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const availabilityStatusSelect = document.getElementById('availability_status');
    const assignedToSelect = document.getElementById('assigned_to');

    function toggleAssignedToRequired() {
        if (availabilityStatusSelect.value === 'Em uso') {
            assignedToSelect.required = true;
        } else {
            assignedToSelect.required = false;
        }
    }

    // Adiciona o listener para mudanças
    availabilityStatusSelect.addEventListener('change', toggleAssignedToRequired);

    // Executa a função no carregamento da página para definir o estado inicial
    toggleAssignedToRequired();

    // Inicializa o Tom Select para os campos de usuário
    new TomSelect('#assigned_to',{
        create: false, // Impede a criação de novas opções
        sortField: {
            field: "text",
            direction: "asc"
        }
    });

    new TomSelect('#authorized_by',{
        create: false,
        sortField: {
            field: "text",
            direction: "asc"
        }
    });
});
</script>
{% endblock %}
