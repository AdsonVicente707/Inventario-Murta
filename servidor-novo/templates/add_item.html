{% extends 'base.html' %}

{% block title %}Adicionar Item{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="mb-4">Adicionar Novo Item</h1>

    <form method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Nome do Item</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="col-md-6">
                <label for="model" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="model" name="model">
            </div>
            <div class="col-md-6">
                <label for="category" class="form-label">Categoria</label>
                <input type="text" class="form-control" id="category" name="category" required>
            </div>
            <div class="col-md-6">
                <label for="location" class="form-label">Localização</label>
                <input type="text" class="form-control" id="location" name="location" required>
            </div>
            <div class="col-md-6">
                <label for="purchase_date" class="form-label">Data de Aquisição</label>
                <input type="date" class="form-control" id="purchase_date" name="purchase_date" required>
            </div>
            <div class="col-md-6">
                <label for="serial_number" class="form-label">Número de Série</label>
                <input type="text" class="form-control" id="serial_number" name="serial_number">
            </div>
            <div class="col-md-6">
                <label for="status" class="form-label">Condição</label>
                <select class="form-select" id="status" name="status" required>
                    <option value="Muito Bom">Muito Bom</option>
                    <option value="Bom">Bom</option>
                    <option value="Aceitável">Aceitável</option>
                    <option value="Ruim">Ruim</option>
                    <option value="Quebrado">Quebrado</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="availability_status" class="form-label">Disponibilidade</label>
                <select class="form-select" id="availability_status" name="availability_status" required>
                    <option value="Livre" selected>Livre</option>
                    <option value="Em uso">Em uso</option>
                    <option value="Em manutenção">Em manutenção</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="assigned_to" class="form-label">Atribuído a</label>
                <select class="form-select" id="assigned_to" name="assigned_to">
                    <option value="">Ninguém</option>
                    {% for user in all_users %}
                        <option value="{{ user.username }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="authorized_by" class="form-label">Autorizado por</label>
                <select class="form-select" id="authorized_by" name="authorized_by">
                    <option value="">N/A</option>
                    {% for admin in all_admins %}
                        <option value="{{ admin.username }}">{{ admin.username }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Adicionar Item</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const availabilityStatusSelect = document.getElementById('availability_status');
    const assignedToSelect = document.getElementById('assigned_to');

    function toggleAssignedToRequired() {
        if (availabilityStatusSelect.value === 'Em uso') {
            assignedToSelect.required = true;
        } else {
            assignedToSelect.required = false;
        }
    }

    // Adiciona o listener para mudanças
    availabilityStatusSelect.addEventListener('change', toggleAssignedToRequired);

    // Executa a função no carregamento da página para definir o estado inicial
    toggleAssignedToRequired();

    // Inicializa o Tom Select para os campos de usuário
    new TomSelect('#assigned_to',{
        create: false, // Impede a criação de novas opções
        sortField: {
            field: "text",
            direction: "asc"
        }
    });

    new TomSelect('#authorized_by',{
        create: false,
        sortField: {
            field: "text",
            direction: "asc"
        }
    });
});
</script>
{% endblock %}
